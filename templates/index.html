<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match History</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
        }
        .winrate-high { background-color: #4CAF50; color: white; }
        .winrate-medium { background-color: #FFD700; color: black; }
        .winrate-low { background-color: #FF4500; color: white; }
    </style>
</head>
<body>
    <h1>Match History</h1>
    <table>
        <thead>
            <tr>
                <th>Match ID</th>
                <th>Timestamp</th>
                <th>Server</th>
                <th>Weighted Win % (T1)</th>
                <th>Weighted Win % (T2)</th>
                <th>Bayesian Win % (T1)</th>
                <th>Bayesian Win % (T2)</th>
                <th>View Details</th>
            </tr>
        </thead>
        <tbody>
            {% for match in matches %}
            <tr>
                <td>{{ match[0] }}</td>
                <td>{{ match[1] }}</td>
                <td>{{ match[2] }}</td>
                <td class="{% if match[3] >= 60 %}winrate-high{% elif match[3] >= 40 %}winrate-medium{% else %}winrate-low{% endif %}">{{ match[3] }}%</td>
                <td class="{% if match[4] >= 60 %}winrate-high{% elif match[4] >= 40 %}winrate-medium{% else %}winrate-low{% endif %}">{{ match[4] }}%</td>
                <td class="{% if match[5] >= 60 %}winrate-high{% elif match[5] >= 40 %}winrate-medium{% else %}winrate-low{% endif %}">{{ match[5] }}%</td>
                <td class="{% if match[6] >= 60 %}winrate-high{% elif match[6] >= 40 %}winrate-medium{% else %}winrate-low{% endif %}">{{ match[6] }}%</td>
                <td><a href="/match/{{ match[0] }}">View Details</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
