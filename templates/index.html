<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Match Scraper</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>League of Legends Match Scraper</h1>

    <form method="POST">
        <label for="server">Server:</label>
        <input type="text" id="server" name="server" required>

        <label for="nickname">Summoner Name:</label>
        <input type="text" id="nickname" name="nickname" required>

        <button type="submit">Scrape Match</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <h2>Stored Matches</h2>
<table border="1">
    <tr>
        <th>Match ID</th>
        <th>Timestamp</th>
        <th>Server</th>
        <th>Team 1 Win %</th>
        <th>Team 2 Win %</th>
        <th>View Data</th>
    </tr>
    {% for match in matches %}
    <tr>
        <td>{{ match[0] }}</td>
        <td>{{ match[1] }}</td>
        <td>{{ match[2] }}</td>
        <td>{{ match[3] }}%</td>  <!-- 🔥 Now displays WIN PROBABILITY -->
        <td>{{ match[4] }}%</td>  <!-- 🔥 Now displays WIN PROBABILITY -->
        <td><a href="/match/{{ match[0] }}">View</a></td>
    </tr>
    {% endfor %}
</table>


</body>
</html>
